services:
  video-converter:
    build: .
    container_name: video-converter
    restart: unless-stopped
    # Intel QSV / VAAPI hardware acceleration (Intel 8505 iGPU)
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # Adjust these to match `getent group render video` on the NAS host
      - "993"   # render
      - "44"    # video
    environment:
      TZ: Asia/Ho_Chi_Minh
      PUID: "1000"
      PGID: "1000"
      CONFIG_PATH: /config/config.yaml
      # Web UI settings. Leave UI_PASSWORD unset for open access on your LAN,
      # or set it to require HTTP Basic auth on every request.
      UI_PORT: "8080"
      # UI_PASSWORD: "change-me"
      # Optional Phase C title/year matching. Docker Compose reads these
      # values from a local .env file; the token is never sent to the browser.
      TMDB_API_TOKEN: "${TMDB_API_TOKEN:-}"
      TMDB_LANGUAGE: "${TMDB_LANGUAGE:-en-US}"
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./state:/state
      # Required for the UI's "Save & Restart" button to rewrite this file
      # and recreate the container. If you don't want the container to have
      # Docker daemon access, remove these two lines — the UI will fall back
      # to read-only mount display.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/compose/docker-compose.yml:rw
      # ==== NAS storage mounted as /media inside the container. ====
      # Mount whole NAS volumes here; then pick which subfolders to scan
      # from the web UI (Setup tab → Scan folders). No compose changes or
      # restarts are needed to add/remove scan folders after this.
      - /volume2:/media/volume2
      # Optional scratch space on fast storage for in-progress files
      - ./tmp:/tmp/convert
